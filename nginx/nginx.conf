worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # JSON形式のカスタムログ（$request_body および TLS 情報も記録）
    log_format honeypot_json escape=json '{'
        '"source": "nginx_proxy",'
        '"ts": "$time_iso8601",'
        '"src_ip": "$remote_addr",'
        '"src_port": "$remote_port",'
        '"dst_port": "$server_port",'
        '"scheme": "$scheme",'
        '"ssl_protocol": "$ssl_protocol",'
        '"ssl_cipher": "$ssl_cipher",'
        '"ssl_server_name": "$ssl_server_name",'
        '"method": "$request_method",'
        '"uri": "$request_uri",'
        '"status": "$status",'
        '"user_agent": "$http_user_agent",'
        '"content_type": "$http_content_type",'
        '"body": "$request_body"'
    '}';

    # 大きな攻撃ペイロードも受け取れるように設定
    client_max_body_size 2m;
    client_body_buffer_size 128k;

    # 送信元IPごとのレート制限（10r/s、共有メモリ10MB）
    limit_req_zone $binary_remote_addr zone=hp_limit:10m rate=10r/s;
    limit_req_status 429;

    # アクセスログをJSON形式で標準出力へ
    access_log /dev/stdout honeypot_json;
    error_log  /dev/stderr warn;

    upstream honeypot_backend {
        server honeypot:8080;
    }

    # HTTP 待ち受け（80 / 8080）
    server {
        listen 80;
        listen 8080;
        server_name _;

        add_header X-Powered-By "PHP/8.2.0" always;

        location / {
            limit_req zone=hp_limit burst=20 nodelay;

            proxy_pass http://honeypot_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Real-Port $remote_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Original-Port $server_port;

            proxy_set_header X-SSL-Protocol $ssl_protocol;
            proxy_set_header X-SSL-Cipher $ssl_cipher;
            proxy_set_header X-SSL-Server-Name $ssl_server_name;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }

    # HTTPS 待ち受け（443 / 8443・自己署名証明書）
    server {
        listen 443 ssl;
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header X-Powered-By "PHP/8.2.0" always;

        location / {
            limit_req zone=hp_limit burst=20 nodelay;

            proxy_pass http://honeypot_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Real-Port $remote_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Original-Port $server_port;

            proxy_set_header X-SSL-Protocol $ssl_protocol;
            proxy_set_header X-SSL-Cipher $ssl_cipher;
            proxy_set_header X-SSL-Server-Name $ssl_server_name;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}