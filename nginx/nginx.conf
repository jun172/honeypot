worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # JSON形式のカスタムログ（$request_body も記録）
    log_format honeypot_json escape=json '{'
        '"source": "nginx_proxy",'
        '"ts": "$time_iso8601",'
        '"src_ip": "$remote_addr",'
        '"src_port": "$remote_port",'
        '"dst_port": "$server_port",'
        '"method": "$request_method",'
        '"uri": "$request_uri",'
        '"status": "$status",'
        '"user_agent": "$http_user_agent",'
        '"content_type": "$http_content_type",'
        '"body": "$request_body"'
    '}';

    # 大きな攻撃ペイロードも受け取れるように設定
    client_max_body_size 2m;
    client_body_buffer_size 128k;

    # 送信元IPごとのレート制限（10r/s、共有メモリ10MB）
    limit_req_zone $binary_remote_addr zone=hp_limit:10m rate=10r/s;
    limit_req_status 429;

    # アクセスログをJSON形式で標準出力へ（不要なら access_log off; でもOK）
    access_log /dev/stdout honeypot_json;
    error_log  /dev/stderr warn;

    upstream honeypot_backend {
        server honeypot:8080;
    }

    server {
        # 80番と8080番の両方で待ち受ける（どちらにマッピングされても確実に動く）
        listen 80;
        listen 8080;
        server_name _;

        # PHPサーバーに見せかけて攻撃者のRCEやSQLiペイロードを誘い出す
        add_header X-Powered-By "PHP/8.2.0" always;

        location / {
            limit_req zone=hp_limit burst=20 nodelay;

            proxy_pass http://honeypot_backend;
            proxy_http_version 1.1;

            # 攻撃者の元のIPやポートを後ろの honeypot コンテナへ正しく引き継ぐ
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}
