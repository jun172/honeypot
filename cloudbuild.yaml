steps:
  # 1. honeypot-http イメージのビルドとプッシュ（並列実行）
  - id: 'build-honeypot-http'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    args:
      - 'build'
      - '-f'
      - 'app/Dockerfile'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/honeypot-515503/cloud-run-source-deploy/honeypot-http:latest'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/honeypot-515503/cloud-run-source-deploy/honeypot-http:$SHORT_SHA'
      - '.'

  - id: 'push-honeypot-http'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-honeypot-http']
    args:
      - 'push'
      - '--all-tags'
      - 'asia-northeast1-docker.pkg.dev/honeypot-515503/cloud-run-source-deploy/honeypot-http'

  # 2. hp-nginx イメージのビルドとプッシュ（並列実行）
  - id: 'build-hp-nginx'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    args:
      - 'build'
      - '-f'
      - 'nginx/Dockerfile'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/honeypot-515503/cloud-run-source-deploy/hp-nginx:latest'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/honeypot-515503/cloud-run-source-deploy/hp-nginx:$SHORT_SHA'
      - 'nginx'

  - id: 'push-hp-nginx'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-hp-nginx']
    args:
      - 'push'
      - '--all-tags'
      - 'asia-northeast1-docker.pkg.dev/honeypot-515503/cloud-run-source-deploy/hp-nginx'

  # 3. イメージプッシュ完了後に VM の startup-script を更新しリセット
  - id: 'update-and-reset-vm'
    name: 'gcr.io/cloud-builders/gcloud'
    waitFor: ['push-honeypot-http', 'push-hp-nginx']
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        gcloud compute instances add-metadata hp-vm-us-01 \
          --zone=us-central1-a \
          --project=honeypot-515503 \
          --metadata-from-file startup-script=startup.sh
        gcloud compute instances reset hp-vm-us-01 \
          --zone=us-central1-a \
          --project=honeypot-515503

images:
  - 'asia-northeast1-docker.pkg.dev/honeypot-515503/cloud-run-source-deploy/honeypot-http:latest'
  - 'asia-northeast1-docker.pkg.dev/honeypot-515503/cloud-run-source-deploy/honeypot-http:$SHORT_SHA'
  - 'asia-northeast1-docker.pkg.dev/honeypot-515503/cloud-run-source-deploy/hp-nginx:latest'
  - 'asia-northeast1-docker.pkg.dev/honeypot-515503/cloud-run-source-deploy/hp-nginx:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY